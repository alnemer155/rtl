# إعداد Cloudflare Pages لمشروع منصة المصادر
# تطبيق Next.js في جذر المستودع — Framework preset: Next.js بدون مجلد جذر خاص
#   Build command:  npx @cloudflare/next-on-pages@1
#   Deploy command: npx wrangler pages deploy
# مهم: name أدناه يجب أن يطابق اسم مشروع Pages في لوحتك حرفياً.

name = "rtl"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[vars]
# NEXT_PUBLIC_API_URL يُضبط من لوحة Cloudflare (Environment variables)
# لأنه يُخبز في حزمة الواجهة وقت البناء، مثال:
# NEXT_PUBLIC_API_URL = "https://masadir-api.onrender.com"
